<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="preload" as="image" href="frames/poster.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{FONT_LINK}}">
<link rel="stylesheet" href="scrub.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="look-{{LOOK}} mode-{{MODE}}">
<a class="skip" href="#context">Skip to content</a>
<header class="top">
  <a class="brand" href="#">{{NAME}}</a>
  <nav aria-label="Primary"><a href="#work">{{NAV_1}}</a><a href="#about">{{NAV_2}}</a><a href="#contact">{{NAV_3}}</a></nav>
</header>

<section class="ss-hero" data-frames="{{FRAMES}}" data-lg="frames/lg" data-sm="frames/sm" data-lg-w="{{LG_W}}" data-sm-w="{{SM_W}}" data-pin="{{PIN}}" aria-label="{{NAME}} intro">
  <div class="ss-stage">
    <img class="ss-poster" src="frames/poster.webp" width="{{POSTER_W}}" height="{{POSTER_H}}" alt="{{POSTER_ALT}}" fetchpriority="high" decoding="async">
    <canvas class="ss-canvas" aria-hidden="true"></canvas>
    <div class="ss-grain" aria-hidden="true"></div>
    <h1 class="ss-cue hook" data-cue="{{CUE_HOOK}}">{{HOOK}}</h1>
    <p class="ss-cue sub" data-cue="{{CUE_SUB}}">{{TAGLINE}}</p>
    <p class="ss-cue hint" data-cue="0,0.02,0.10" aria-hidden="true">Scroll</p>
  </div>
</section>

<main>
  <section id="context" class="band ss-reveal">
    <p class="lede">{{CONTEXT}}</p>
  </section>

  <section id="work" class="band">
    <h2 class="ss-reveal">{{WORK_TITLE}}</h2>
    <ol class="items">
      {{ITEMS}}
    </ol>
  </section>

  <section id="about" class="band peak ss-reveal">
    <h2>{{PEAK_TITLE}}</h2>
    <p class="lede">{{PEAK_TEXT}}</p>
  </section>

  <section id="contact" class="band close ss-reveal">
    <h2>{{CLOSE_TITLE}}</h2>
    <p><a class="cta" href="{{CTA_HREF}}">{{CTA_LABEL}}</a></p>
    <p class="muted">{{CONTACT}}</p>
  </section>
</main>
<footer class="foot"><span>{{NAME}}</span><span>{{YEAR}}</span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
<script src="scrub-core.js"></script>
<script src="scrub.js"></script>
</body>
</html>
